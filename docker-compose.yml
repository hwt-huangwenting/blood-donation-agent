services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blood_agent_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blood_agent
    ports:
      - "5432:5432"
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blood_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_pg_data:
